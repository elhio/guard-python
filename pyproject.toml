[project]
name = "guard-client"
version = "0.0.1rc1"
description = "A Python client for seamlessly integrating visual safety filters into your applications"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Elhio" }]
keywords = [
    "content-moderation",
    "content-safety",
    "ai-generated",
    "deepfake",
    "violence",
    "image-moderation",
    "video-moderation",
    "trust-and-safety",
    "api-client",
    "sdk",
    "async",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
local = ["guard-local-detector>=0.0.1"]

[project.urls]
Homepage = "https://elhio.com/"
Repository = "https://github.com/elhio/guard-python"
Issues = "https://github.com/elhio/guard-python/issues"
Changelog = "https://github.com/elhio/guard-python/releases"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipython>=8.0",
]
docs = [
    "griffe>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guard_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
exclude = ["tests/test_contract.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
extend-select = ["D213"]
ignore = [
    "UP006",
    "UP007",
    "UP035",
    "UP045",
    "D200",
    "D212",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tests/test_contract.py" = ["D", "E501", "I001", "SIM105"]
"scripts/**" = ["D101", "D102", "D103", "D107"]

[tool.mypy]
packages = ["guard_client"]
strict = true

[[tool.mypy.overrides]]
module = ["guard_local", "guard_local.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["guard_client.display"]
disallow_untyped_calls = false
